[project]
name = "carmen-kernels"
version = "0.1.0"
description = "An AI writes Apple Metal GPU kernels, a judge it can't fool proves them, and the winners run inside a real model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Utsav Khairnar" }]
keywords = ["mlx", "metal", "apple-silicon", "gpu-kernels", "llm-inference", "ai-agents", "benchmarking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]
dependencies = [
    "numpy>=1.26",
    "anthropic>=1.0",
    "textual>=0.80",
    # On Apple Silicon, the GPU parts install by default, so `pip install carmen-kernels` is all you need.
    "mlx>=0.25; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
metal = ["mlx>=0.25"]
models = ["mlx>=0.25", "mlx-lm>=0.20"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/utsav1033/carmen"
Repository = "https://github.com/utsav1033/carmen"
"How it works" = "https://github.com/utsav1033/carmen/blob/main/docs/how-it-works.md"

[project.scripts]
carmen = "carmen.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carmen*"]

[tool.setuptools.package-data]
carmen = ["golden/*.metal", "champions/*.json", "champions/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
