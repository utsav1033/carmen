</defs>
<rect width="1280" height="420" rx="22" fill="url(#bg)"/>
<rect width="1280" height="420" rx="22" fill="url(#grid)"/>
<rect width="1280" height="420" rx="22" fill="url(#glow)"/>
<g transform="translate(88 0)">
  <rect x="0" y="92" width="44" height="6" rx="3" fill="#ff7a2f"/>
  <text x="-6" y="238" class="t" font-size="168" letter-spacing="-7" fill="url(#ink)">carmen</text>
  <text x="0" y="296" class="g" font-size="34" fill="#e9dfd3" fill-opacity="0.92">let the model cook. trust nothing it can’t prove.</text>
  <text x="0" y="352" class="m" font-size="19" fill="#ff9a5c">carmy writes  →  the judge proves  →  the loop learns</text>
  <text x="0" y="382" class="m" font-size="15" fill="#8d8378">apple metal · mlx · softmax · masked_softmax · open source</text>
</g>
<g transform="translate(900 92)">
  <rect width="300" height="252" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
  <circle cx="24" cy="24" r="5" fill="#ff5f57" fill-opacity="0.8"/><circle cx="42" cy="24" r="5" fill="#febc2e" fill-opacity="0.8"/><circle cx="60" cy="24" r="5" fill="#28c840" fill-opacity="0.8"/>
  <text x="24" y="66" class="m" font-size="15" fill="#8d8378">the judge</text>
  <text x="24" y="102" class="m" font-size="17" fill="#e9dfd3"><tspan fill="#5fd38d">✓</tspan> compiles</text>
  <text x="24" y="134" class="m" font-size="17" fill="#e9dfd3"><tspan fill="#5fd38d">✓</tspan> matches float64</text>
  <text x="24" y="166" class="m" font-size="17" fill="#e9dfd3"><tspan fill="#5fd38d">✓</tspan> survives unseen inputs</text>
  <text x="24" y="198" class="m" font-size="17" fill="#e9dfd3"><tspan fill="#5fd38d">✓</tspan> faster, with a CI</text>
  <text x="24" y="232" class="m" font-size="15" fill="#8d8378"><tspan fill="#ff5f6e">✗</tspan> everything else</text>
</g>
