name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # The judge, loop, memory and app are tested against a numpy stand-in for the GPU,
    # so CI runs on Linux. Real Metal runs happen on Apple Silicon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
